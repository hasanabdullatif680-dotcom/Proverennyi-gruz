<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Проверенный Груз РТ</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',system-ui,-apple-system,sans-serif}
body{background:#0b0e14;color:#eef1f6;min-height:100vh}
body:before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;
 background:radial-gradient(900px 460px at 15% -8%,rgba(245,183,61,.13),transparent 60%),
 radial-gradient(800px 460px at 108% 6%,rgba(59,130,246,.11),transparent 60%)}
#app{position:relative;z-index:1;max-width:560px;margin:0 auto;padding:0 14px 96px}
.top{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.top .logo{height:46px;width:46px;border-radius:50%;border:2px solid rgba(245,183,61,.55);box-shadow:0 0 18px rgba(245,183,61,.28)}
.brand{font-weight:800;font-size:17px;line-height:1.1;background:linear-gradient(90deg,#f5b73d,#ffe29a);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand small{display:block;font-size:10px;font-weight:600;color:#8b93a3;-webkit-text-fill-color:#8b93a3}
.sup{margin-left:auto;font-size:12px;font-weight:600;color:#f5b73d;border:1px solid rgba(245,183,61,.4);padding:7px 11px;border-radius:20px;text-decoration:none;white-space:nowrap}
.view{display:none;animation:fade .25s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:16px;backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,.35);margin-bottom:14px}
.card h2{font-size:17px;margin-bottom:10px}
.card h3{font-size:15px;margin:10px 0 6px}
.muted{color:#9aa3b2;font-size:13px}
.btn{display:block;width:100%;border:0;border-radius:14px;padding:14px;font-size:15px;font-weight:700;color:#1a1206;background:linear-gradient(135deg,#f5b73d,#ffd97a);cursor:pointer;box-shadow:0 8px 22px rgba(245,183,61,.22);transition:transform .12s}
.btn:active{transform:scale(.98)}
.btn.ghost{background:rgba(255,255,255,.08);color:#eef1f6;border:1px solid rgba(255,255,255,.16);box-shadow:none}
.btn.green{background:linear-gradient(135deg,#19c37d,#6be3a9);color:#04150c;box-shadow:0 0 24px rgba(25,195,125,.45)}
.btn.red{background:linear-gradient(135deg,#e05252,#ff8a7a);color:#fff;box-shadow:none}
.btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:13px;border-radius:11px}
.btn + .btn{margin-top:10px}
.row{display:flex;gap:10px}.row>*{flex:1}
label{display:block;font-size:12px;color:#9aa3b2;margin:10px 0 4px}
input,select,textarea{width:100%;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.14);color:#eef1f6;border-radius:12px;padding:12px;font-size:15px;outline:none;-webkit-appearance:none;appearance:none}
select option{background:#141824;color:#eef1f6}
input:focus,select:focus,textarea:focus{border-color:rgba(245,183,61,.65)}
textarea{min-height:80px;resize:vertical}
.err{color:#ff8a7a;font-size:13px;min-height:18px;margin:8px 0}
.ok{color:#6be3a9;font-size:13px;margin:8px 0}
.role-row{display:flex;gap:10px;margin:6px 0 4px}
.role{flex:1;cursor:pointer;border:1.5px solid rgba(255,255,255,.14);border-radius:14px;padding:14px 10px;text-align:center;background:rgba(255,255,255,.05)}
.role b{display:block;font-size:14px;margin-bottom:3px}
.role span{font-size:11px;color:#9aa3b2}
.role.on{border-color:#f5b73d;background:rgba(245,183,61,.1);box-shadow:0 0 16px rgba(245,183,61,.2)}
.agree{display:flex;gap:12px;align-items:flex-start;cursor:pointer;padding:13px;border:1.5px solid rgba(255,255,255,.16);border-radius:14px;margin:14px 0 6px;background:rgba(255,255,255,.04)}
.agree input[type=checkbox]{width:24px;height:24px;min-width:24px;accent-color:#f5b73d;margin:0;cursor:pointer}
.agree span{font-size:13px;color:#c8cfda;line-height:1.45}
.agree a{color:#f5b73d;text-decoration:underline}
.carousel{position:relative;border-radius:18px;overflow:hidden;margin-bottom:14px;box-shadow:0 12px 30px rgba(0,0,0,.4)}
.carousel .frame{display:none}
.carousel .frame.on{display:block;animation:fade .4s}
.carousel img{width:100%;height:180px;object-fit:cover;display:block}
.dots{position:absolute;bottom:9px;left:0;right:0;display:flex;justify-content:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.4);cursor:pointer}
.dot.on{background:#f5b73d}
.adtag{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);padding:4px 10px;border-radius:12px;font-size:11px;color:#ffd97a}
.stats{display:flex;gap:10px;margin-bottom:14px}
.stat{flex:1;text-align:center;background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:11px 6px}
.stat b{display:block;font-size:19px;color:#f5b73d}
.stat span{font-size:11px;color:#9aa3b2}
.listing{background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.12);border-radius:16px;padding:14px;margin-bottom:12px;backdrop-filter:blur(12px)}
.listing .lt{font-weight:700;font-size:15px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:9px}
.badge.green{background:rgba(25,195,125,.18);color:#6be3a9;border:1px solid rgba(25,195,125,.4)}
.badge.gold{background:rgba(245,183,61,.15);color:#ffd97a;border:1px solid rgba(245,183,61,.4)}
.badge.red{background:rgba(224,82,82,.15);color:#ff8a7a;border:1px solid rgba(224,82,82,.4)}
.meta{color:#9aa3b2;font-size:12.5px;margin-top:5px;line-height:1.55}
.price{color:#f5b73d;font-weight:800;font-size:16px;margin-top:6px}
.avatar{width:78px;height:78px;border-radius:50%;background:linear-gradient(135deg,#f5b73d,#b98a1e);display:flex;align-items:center;justify-content:center;font-size:30px;font-weight:800;color:#1a1206;flex:none;border:2px solid rgba(245,183,61,.5)}
.phead{display:flex;gap:14px;align-items:center}
.pname{font-size:19px;font-weight:800}
.stars{font-size:22px;letter-spacing:2px;line-height:1}
.st .s{color:#e05252;opacity:.55}
.st .s.full{color:#f5b73d;opacity:1;text-shadow:0 0 10px rgba(245,183,61,.5)}
.st .s.half{background:linear-gradient(90deg,#f5b73d 50%,rgba(224,82,82,.55) 50%);-webkit-background-clip:text;background-clip:text;color:transparent;opacity:1}
.st.warn .s.full{color:#e05252;text-shadow:0 0 10px rgba(224,82,82,.5)}
.ratepick{font-size:30px;letter-spacing:3px;cursor:pointer;user-select:none;margin:6px 0}
.ratepick span{color:rgba(255,255,255,.25)}
.ratepick span.on{color:#f5b73d;text-shadow:0 0 10px rgba(245,183,61,.5)}
.enroute{display:flex;align-items:center;justify-content:space-between;gap:12px}
.enroute .st-btn{border:1.5px solid rgba(255,255,255,.2);background:rgba(255,255,255,.06);color:#9aa3b2;border-radius:14px;padding:12px 18px;font-weight:800;font-size:14px;cursor:pointer;transition:.2s}
.enroute .st-btn.on{background:linear-gradient(135deg,#19c37d,#6be3a9);color:#04150c;border-color:transparent;box-shadow:0 0 26px rgba(25,195,125,.55);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 14px rgba(25,195,125,.4)}50%{box-shadow:0 0 30px rgba(25,195,125,.75)}}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:rgba(13,16,24,.94);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.1);padding:8px 4px calc(9px + env(safe-area-inset-bottom));z-index:50}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;color:#8b93a3;font-size:10px;cursor:pointer;padding:5px 8px;border-radius:10px}
.tab.active{color:#f5b73d;background:rgba(245,183,61,.09)}
.tab i{font-style:normal;font-size:20px}
.fab{position:fixed;right:16px;bottom:86px;z-index:49;width:56px;height:56px;border-radius:50%;border:0;background:linear-gradient(135deg,#f5b73d,#ffd97a);color:#1a1206;font-size:26px;font-weight:800;box-shadow:0 10px 26px rgba(245,183,61,.4);cursor:pointer}
.empty{text-align:center;padding:36px 14px;color:#8b93a3}
.empty .big{font-size:40px;margin-bottom:8px}
.review{border-top:1px solid rgba(255,255,255,.08);padding:10px 0}
.review:first-of-type{border-top:0}
.claim{background:rgba(224,82,82,.08);border:1px solid rgba(224,82,82,.3);border-radius:12px;padding:10px;margin-top:8px;font-size:13px}
.claim.done{background:rgba(25,195,125,.08);border-color:rgba(25,195,125,.3)}
.mini{font-size:12px;color:#9aa3b2;margin-top:3px}
.linkish{color:#f5b73d;cursor:pointer;text-decoration:underline}
a.suplink{color:#f5b73d;text-decoration:none}
hr.sep{border:0;border-top:1px solid rgba(255,255,255,.08);margin:12px 0}
.admlist{display:flex;justify-content:space-between;gap:8px;align-items:center;padding:9px 0;border-top:1px solid rgba(255,255,255,.07);font-size:13px}
.admlist:first-of-type{border-top:0}
</style>
</head>

/* ===== Рейтинг (1/3 звезды за положительный отзыв) ===== */
function ratingOf(u){ return Math.min(5, (u.pos||0)/3); }
function starsHtml(u){
 var r=ratingOf(u); var openClaim=openClaimCount(u.id);
 var h='<div class="stars st'+(openClaim>0?' warn':'')+'">';
 for(var i=1;i<=5;i++){
  if(r>=i-0.001) h+='<span class="s full">★</span>';
  else if(r>i-1) h+='<span class="s half">★★</span>';
  else h+='<span class="s">★</span>';
 }
 h+='</div>';
 if(openClaim>0) h+='<div class="mini" style="color:#ff8a7a">⚠ Есть открытая претензия — будьте внимательны</div>';
 return h;
}

function stopAds(){ if(adTimer){ clearInterval(adTimer); adTimer=null; } }
function startAds(){
 stopAds();
 if(adTimer) return;
 adTimer=setInterval(function(){
  if(VIEW!=='home') return;
  var ads=builtAds();
  if(ads.length<2) return;
  adIdx=(adIdx+1)%ads.length;
  var fr=document.querySelectorAll('#carousel .frame');
  var dt=document.querySelectorAll('#carousel .dot');
  for(var i=0;i<fr.length;i++){ fr[i].classList.toggle('on', i===adIdx); dt[i].classList.toggle('on', i===adIdx); }
 },4000);
}

function applyFilters(kind, arr){
 var q=''; try{ q=(document.getElementById('fq').value||'').toLowerCase(); }catch(e){}
 function match(s){ return String(s||'').toLowerCase().indexOf(q)>=0; }
 return arr.filter(function(it){
  var u=byId(it.owner); if(u&&u.blocked) return false;
  if(q && !(match(it.from)||match(it.to)||match(it.note)||match(it.type)||match(it.cat))) return false;
  if(kind==='cargos'){
   var f=g('fFrom'), t=g('fTo'), ty=g('fType'), w=g('fW'), v=g('fV'), bb=g('fB');
   if(f&&it.from!==f) return false; if(t&&it.to!==t) return false;
   if(ty&&it.type!==ty) return false; if(w&&it.weight!==w) return false;
   if(v&&it.vol!==v) return false; if(bb&&it.body!==bb) return false;
  }
  if(kind==='transport'){
   var tt=g('fTruck'), c=g('fCity'), tn=g('fTons'), v2=g('fVol2');
   if(tt&&it.type!==tt) return false; if(c&&it.from!==c) return false;
   if(tn&&it.tons!==tn) return false; if(v2&&it.vol!==v2) return false;
  }
  if(kind==='tech'){
   var ct=g('fCat'), c3=g('fCity3');
   if(ct&&it.cat!==ct) return false; if(c3&&it.from!==c3) return false;
  }
  return true;
 });
 function g(id){ var e=document.getElementById(id); return e?e.value:''; }
}

function postIt(kind){
 var me=cur(); var err=document.getElementById('fErr'); var msg='';
 var it={id:uid(), owner:CUR, phone:me.phone, ts:Date.now()};
 function v(id){ var e=document.getElementById(id); return e?e.value:''; }
 if(kind==='cargos'){
  it.from=v('cFrom'); it.to=v('cTo'); it.date=v('cDate'); it.type=v('cType');
  it.weight=v('cWeight'); it.vol=v('cVol'); it.body=v('cBody'); it.budget=v('cBudget'); it.note=v('cNote');
  if(!it.from||!it.to) msg='Выберите города «Откуда» и «Куда»';
  if(it.from && it.from===it.to) msg='Город отправки и прибытия совпадают';
 } else if(kind==='transport'){
  it.type=v('tType'); it.tons=v('tTons'); it.vol=v('tVol'); it.len=v('tLen');
  it.from=v('tFrom'); it.to=v('tTo'); it.date=v('tDate'); it.price=v('tPrice')||'Договорная'; it.note=v('tNote');
  if(!it.from) msg='Выберите город, где вы находитесь';
 } else {
  it.cat=v('xCat'); it.cap=v('xCap'); it.boom=v('xBoom'); it.bucket=v('xBucket');
  it.from=v('xFrom'); it.to=''; it.date=v('xDate'); it.price=v('xPrice'); it.note=v('xNote');
  if(!it.from) msg='Выберите город, где находится техника';
 }
 if(msg){ err.textContent=msg; return; }
 STORE[kind].push(it); save();
 show(kind);
}

}

function reviewsFor(uid_){

}
function claimsFor(uid_){

}

/* ===== События ===== */
function onAct(el, act){
 var t=el;
 switch(act){
  case 'selRole':
   regRole=t.getAttribute('data-role');
   var rs=document.querySelectorAll('.role');
   for(var i=0;i<rs.length;i++) rs[i].classList.toggle('on', rs[i]===t);
   break;
  case 'register': doRegister(); break;
  case 'nav': show(t.getAttribute('data-view')); break;
  case 'back': show(prevView||'home'); break;
  case 'adDot':
   adIdx=parseInt(t.getAttribute('data-i'),10)||0;
   var fr=document.querySelectorAll('#carousel .frame'), dt=document.querySelectorAll('#carousel .dot');
   for(i=0;i<fr.length;i++){ fr[i].classList.toggle('on', i===adIdx); dt[i].classList.toggle('on', i===adIdx); }
   break;
  case 'fab': show('form-'+prevView); break;
  case 'openProfile': openUid=t.getAttribute('data-uid'); pickStars=0; pickTarget=openUid; show('user'); break;
  case 'call': location.href='tel:'+String(t.getAttribute('data-phone')||'').replace(/[^\d+]/g,''); break;
  case 'delListing': {
   var kind=t.getAttribute('data-kind'), id=t.getAttribute('data-id');
   var me=cur(); if(!me) break;
   var arr=STORE[kind];
   var it=null;
   for(i=0;i<arr.length;i++) if(arr[i].id===id) it=arr[i];
   if(!it) break;
   var owner=byId(it.owner);
   if(!(me.admin || it.owner===CUR)) break;
   STORE[kind]=STORE[kind].filter(function(x){return x.id!==id;});
   save(); render(); break; }
  case 'toggleEnroute': {
   var u=cur(); if(!u) break;
   u.enroute=!u.enroute; save(); render(); break; }
  case 'logout':
   CUR=null; STORE.sess=null; save(); show('auth'); break;
  case 'ratepick':
   pickStars=parseInt(t.getAttribute('data-star'),10)||0;
   var sp=document.querySelectorAll('#ratepick span');
   for(i=0;i<sp.length;i++) sp[i].classList.toggle('on', parseInt(sp[i].getAttribute('data-star'),10)<=pickStars);
   break;
  case 'sendReview': {
   var target=byId(openUid); var me2=cur();
   if(!target||!me2) break;
   if(!pickStars){ var ok=document.getElementById('revOk'); if(ok) ok.textContent='Выберите звёзды: нажмите на ★'; break; }
   STORE.reviews.push({id:uid(), target:target.id, from:CUR, stars:pickStars, text:(document.getElementById('revText').value||'').trim(), ts:Date.now()});
   if(pickStars>=4){ target.pos=(target.pos||0)+1; }
   save(); pickStars=0;
   var ok2=document.getElementById('revOk'); if(ok2) ok2.textContent='Отзыв отправлен. Спасибо!';
   render(); break; }
  case 'sendClaim': {
   var tgt=byId(openUid); var me3=cur();
   if(!tgt||!me3) break;
   var txt=(document.getElementById('claimText').value||'').trim();
   if(txt.length<5){ var ck=document.getElementById('claimOk'); if(ck) ck.textContent='Опишите претензию подробнее'; break; }
   STORE.claims.push({id:uid(), target:tgt.id, from:CUR, text:txt, status:'Открыта', ts:Date.now()});
   save();
   var ck2=document.getElementById('claimOk'); if(ck2) ck2.textContent='Претензия отправлена. Разбор через поддержку: @proverenny_gruz_rt';
   render(); break; }
  case 'report': {
   var rt=byId(t.getAttribute('data-uid')); var me4=cur();
   if(!rt||!me4) break;
   STORE.rep[rt.id]=(STORE.rep[rt.id]||0)+1;
   if(STORE.rep[rt.id]>=3 && !rt.blocked){ rt.blocked=true; }
   save();
   var ro=document.getElementById('repOk'); if(ro) ro.textContent = rt.blocked ? 'Жалоба принята. Пользователь перенесён в чёрный список.' : 'Жалоба принята. Жалоб на профиль: '+reportCount(rt.id)+' из 3';
   render(); break; }
  case 'addAd': {
   var url=(document.getElementById('adUrl').value||'').trim();
   var ae=document.getElementById('adErr');
   if(!url){ if(ae) ae.textContent='Вставьте ссылку на картинку'; break; }
   STORE.ads.push({id:uid(), img:url, url:url}); save();
   if(ae) ae.textContent=''; render(); break; }
  case 'delAd': {
   var aid=t.getAttribute('data-id');
   STORE.ads=STORE.ads.filter(function(x){return x.id!==aid;}); save(); render(); break; }
  case 'solveClaim': {
   var cid=t.getAttribute('data-id');
   for(i=0;i<STORE.claims.length;i++) if(STORE.claims[i].id===cid) STORE.claims[i].status='Решено';
   save(); render(); break; }
  case 'delClaim': {
   var cid2=t.getAttribute('data-id');
   STORE.claims=STORE.claims.filter(function(x){return x.id!==cid2;}); save(); render(); break; }
  case 'block': {
   var nm=(document.getElementById('blPick').value||'');
   for(i=0;i<STORE.users.length;i++) if(STORE.users[i].name===nm) STORE.users[i].blocked=true;
   save(); render(); break; }
  case 'unblock': {
   var bid=t.getAttribute('data-id');
   var bu=byId(bid); if(bu){ bu.blocked=false; STORE.rep[bid]=0; }
   save(); render(); break; }
  case 'postCargo': postIt('cargos'); break;
  case 'postTransport': postIt('transport'); break;
  case 'postTech': postIt('tech'); break;
 }
}
document.addEventListener('click', function(ev){
 var el=ev.target;
 while(el && el!==document.body){
  if(el.getAttribute && el.getAttribute('data-act')){
   var act=el.getAttribute('data-act');
   if(act==='nav' && el.tagName==='A') ev.preventDefault();
   onAct(el, act);
   return;
  }
  el=el.parentNode;
 }
});
document.addEventListener('change', function(ev){
 var el=ev.target;
 if(el && el.id==='fq'){ render(); var q=document.getElementById('fq'); if(q){ q.focus(); } }
});
var _tryInit=function(){
 load();
 if(STORE.sess){ CUR=STORE.sess; }
 document.getElementById('topLogo').src=IMG.LOGO;
 show(CUR?'home':'auth');
};
_tryInit();

</script>
</body>
