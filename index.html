<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ПРОВЕРЕННЫЙ ГРУЗ</title>
<style>
:root{--bg:#0e1116;--card:#171c24;--text:#e8ecf1;--muted:#8b96a5;--accent:#2ecc71;--accent2:#27ae60;--line:#232a35;--danger:#e74c3c;--warn:#f39c12}
[data-theme="light"]{--bg:#f4f6f9;--card:#ffffff;--text:#1a1f27;--muted:#697382;--line:#e2e7ee}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,'Segoe UI',Roboto,sans-serif;padding-bottom:70px}
.screen{padding:14px;max-width:640px;margin:0 auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
h1{font-size:22px;margin-bottom:10px}h2{font-size:18px;margin:14px 0 8px}
.btn{display:block;width:100%;padding:13px;border:0;border-radius:12px;background:var(--accent);color:#06220f;font-weight:700;font-size:16px;margin:8px 0;cursor:pointer}
.btn.gray{background:var(--line);color:var(--text)}
.btn.red{background:var(--danger);color:#fff}
.btn.small{display:inline-block;width:auto;padding:8px 14px;font-size:14px;border-radius:10px}
input,select,textarea{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;margin:5px 0}
label{font-size:13px;color:var(--muted);display:block;margin-top:8px}
.banner{border-radius:14px;overflow:hidden;margin-bottom:12px;min-height:90px;background:linear-gradient(120deg,#27ae60,#145a32);display:flex;align-items:center;padding:16px;color:#fff;font-weight:800;font-size:18px}
.banner img{width:100%;display:block}
.logo{height:44px;border-radius:10px}
.row{display:flex;gap:8px;align-items:center}
.pill{display:inline-block;padding:4px 10px;border-radius:20px;background:var(--line);color:var(--muted);font-size:12px;margin:2px}
.pill.ok{background:rgba(46,204,113,.15);color:var(--accent)}
.pill.warn{background:rgba(243,156,18,.15);color:var(--warn)}
.pill.red{background:rgba(231,76,60,.15);color:var(--danger)}
.circles{display:flex;gap:5px}
.circle{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted)}
.circle.f1{background:33% var(--accent);background:conic-gradient(var(--accent) 0 33%,transparent 33% 100%);border-color:var(--accent)}
.circle.f2{background:conic-gradient(var(--accent) 0 66%,transparent 66% 100%);border-color:var(--accent)}
.circle.f3{background:var(--accent);border-color:var(--accent)}
.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid var(--line);display:flex}
.nav button{flex:1;background:none;border:0;color:var(--muted);padding:10px 2px;font-size:11px;cursor:pointer}
.nav button.on{color:var(--accent)}
.nav .ic{font-size:20px;display:block}
.check{display:var(--accent);color:#06220f;font-weight:900}
.verified{color:var(--accent);font-weight:700}
.tabs{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
.tabs button{padding:8px 14px;border-radius:20px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.tabs button.on{border-color:var(--accent);color:var(--accent)}
.small{font-size:12px;color:var(--muted)}
a{color:var(--accent)}
table{width:100%;border-collapse:collapse;font-size:13px}
td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left}
.toast{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:var(--accent2);color:#fff;padding:10px 18px;border-radius:12px;z-index:99}
.hidden{display:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="toast"></div>
<script>
/* ============ ХРАНИЛИЩЕ ============ */
const KEY='pg_db_v1';
let db=JSON.parse(localStorage.getItem(KEY)||'null')||{
 users:[],loads:[],claims:[],reviews:[],blacklist:[],viol:[],news:[],ads:[],
 notifs:[],appReviews:[],searches:[],settings:{banner:'',logo:'',tg:'https://t.me/proverennyi_gruz'},
 session:null,trialStart:null
};
function save(){localStorage.setItem(KEY,JSON.stringify(db));}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.className='toast';setTimeout(()=>el.className='toast hidden',2200);}
function esc(s){return (s||'').toString().replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));}
function uid(){return Date.now()+''+Math.floor(Math.random()*999);}
function phoneNorm(p){return (p||'').replace(/\D/g,'').slice(-10);}
function djb2(s){let h=5381;for(let i=0;i<s.length;i++){h=((h<<5)+h+s.charCodeAt(i))>>>0;}return 'h'+h;}
const ADMIN_HASH=djb2('ПГРТ-2026');
function me(){return db.users.find(u=>u.id===db.session);}

/* ============ ГОРОДА (~100, Татарстан + Россия) ============ */
const CITIES=["Казань","Набережные Челны","Нижнекамск","Альметьевск","Зеленодольск","Елабуга","Бугульма","Чистополь","Лениногорск","Заинск","Нурлат","Мензелинск","Бавлы","Агрыз","Арск","Кукмор","Мамадыш","Тетюши","Буинск","Азнакаево","Лаишево","Рыбная Слобода","Пестрецы","Аксубаево","Алексеевское","Апастово","Балтаси","Верхний Услон","Высокая Гора","Дрожжаное","Камское Устье","Куйбышевский Затон","Сарманово","Спасск","Тюлячи","Черемшан","Ютазы","Актаныш","Муслюмово","Новошешминск","Атня","Кайбицы","Пестречинка",
"Москва","Санкт-Петербург","Самара","Уфа","Пермь","Екатеринбург","Челябинск","Тюмень","Ижевск","Киров","Чебоксары","Йошкар-Ола","Ульяновск","Саратов","Пенза","Оренбург","Нижний Новгород","Владимир","Иваново","Кострома","Ярославль","Вологда","Рязань","Тула","Калуга","Брянск","Смоленск","Тверь","Псков","Великий Новгород","Курск","Орёл","Липецк","Воронеж","Тамбов","Белгород","Ростов-на-Дону","Таганрог","Краснодар","Ставрополь","Астрахань","Волгоград","Сочи","Симферополь","Севастополь","Керчь","Сургут","Нижневартовск","Новый Уренгой","Ноябрьск","Ханты-Мансийск","Архангельск","Северодвинск","Мурманск","Калининград","Ухта","Воркута","Сыктывкар","Новосибирск","Красноярск","Омск","Томск","Кемерово","Новокузнецк","Барнаул","Иркутск","Улан-Удэ","Чита","Якутск","Хабаровск","Владивосток","Уссурийск","Благовещенск","Южно-Сахалинск","Абакан","Кызыл","Горно-Алтайск","Майкоп","Нальчик","Владикавказ","Грозный","Магас","Черкесск","Элиста","Махачкала","Каспийск","Дербент","Салават","Стерлитамак","Орск","Балаково","Дзержинск","Тольятти","Сызрань","Миасс","Магнитогорск","Копейск","Первоуральск","Серов"];
const BODY_TYPES=["Тент","Рефрижератор","Борт","Зерновоз","Бункеровоз","Контейнеровоз","Изотерм","Самосвал","Муковоз","Цистерна","Битумовоз","Автовоз","Скотовоз","Панелевоз","Металловоз","Трал","Низкорамник","Манипулятор","Хлебовоз","Реф с мясным режимом","Тент 100 м³","Штора"];
const SPEC22=["Экскаватор","Погрузчик","Бульдозер","Кран","Автовышка","Манипулятор","Самосвал","Грейдер","Каток","Асфальтоукладчик","Бетоносмеситель","Автобетононасос","Ямобур","Сваебой","Кран-манипулятор","Снегопогрузчик","Трактор МТЗ","Трактор К-700","Комбайн","Культиватор","Сеялка","Опрыскиватель"];
const PAY=["Наличные","Безналичные с НДС","Безналичные без НДС"];
const BAD=["дурак","идиот","спам","казино","наркотик"];
const TATAR="https://t.me/proverennyi_gruz";

/* ============ НАВИГАЦИЯ ============ */
let nav={screen:'welcome',tab:'feed',admin:false,loadFilter:{from:'',to:''},editUserId:null};
function go(o){Object.assign(nav,o);render();}

function route(){
 if(!db.session){return nav.screen==='auth'?'auth':(db.trialStart&&Date.now()-db.trialStart>86400000?'blocked':'welcome');}
 const u=me();
 if(!u){return 'auth';}
 if(u.deletedAt){return Date.now()>u.restoreUntil?'welcome':'restore';}
 if(nav.screen==='admin')return 'admin';
 return nav.screen;
}

/* ============ ЭКРАН ПРАВИЛ ============ */
function scrWelcome(){
 return `<div class="screen"><div class="card" style="text-align:center">
  ${db.settings.logo?`<img class="logo" src="${db.settings.logo}">`:`<div style="font-size:40px">🚚</div>`}
  <h1>ПРОВЕРЕННЫЙ ГРУЗ</h1>
  <p class="small">Перевозки по Татарстану и России</p></div>
  <div class="card"><h2>Правила</h2>
  <p>1. Уважайте собеседника: оскорбления ведут к предупреждениям и Ч/С.<br>
  2. Не размещайте недостоверные грузы и рейсы.<br>
  3. После 3 предупреждений — Чёрный список.<br>
  4. Претензии рассматривает администрация.<br>
  5. Пробный период — 24 часа, затем нужна регистрация.</p>
  <label><input type="checkbox" id="rulesOk" style="width:auto"> Я прочитал и согласен с правилами</label>
  <button class="btn" onclick="acceptRules()">Пробный период 24 часа</button>
  <button class="btn gray" onclick="go({screen:'auth'})">Зарегистрироваться сейчас</button>
  </div></div>`;
}
function acceptRules(){
 if(!document.getElementById('rulesOk').checked){toast('Поставьте галочку согласия');return;}
 db.trialStart=Date.now();save();go({screen:'auth'});
}
function scrBlocked(){return `<div class="screen"><div class="card" style="text-align:center">
 <div style="font-size:44px">⏳</div><h1>Пробный период окончен</h1>
 <p>Прошло 24 часа. Чтобы продолжить пользоваться приложением, зарегистрируйтесь.</p>
 <button class="btn" onclick="go({screen:'auth'})">Зарегистрироваться</button></div></div>`;}

/* ============ РЕГИСТРАЦИЯ ============ */
function scrAuth(){
 return `<div class="screen"><div class="card">
 <h1>Регистрация</h1>
 <label>Я ...</label>
 <select id="rRole"><option value="driver">Водитель</option><option value="owner">Грузовладелец</option></select>
 <label>Фамилия</label><input id="rFam">
 <label>Имя</label><input id="rIm">
 <label>Статус</label><select id="rStatus"><option>Физлицо</option><option>Самозанятый</option><option>ИП</option><option>ООО</option></select>
 <label>Телефон</label><input id="rPhone" placeholder="+7 900 000-00-00">
 <div id="drvFields">
  <label>Габариты Д×Ш×В (м)</label><input id="rDims" placeholder="13,6 × 2,45 × 2,7">
  <label>Тоннаж (т)</label><input id="rTons" placeholder="20">
  <label>Кузов</label><select id="rBody">${BODY_TYPES.map(b=>`<option>${b}</option>`).join('')}</select>
  <label>Температурный режим</label><input id="rTemp" placeholder="от -20 до +12 °C (если применимо)">
  <label>Есть спецтехника?</label><select id="rSpecQ" onchange="document.getElementById('specBox').classList.toggle('hidden',this.value!=='yes')"><option value="no">Нет</option><option value="yes">Да</option></select>
  <div id="specBox" class="hidden"><label>Выберите виды (можно несколько)</label>
  <div style="max-height:160px;overflow:auto;border:1px solid var(--line);border-radius:10px;padding:8px">${SPEC22.map((s,i)=>`<label><input type="checkbox" class="specChk" value="${esc(s)}" style="width:auto"> ${esc(s)}</label>`).join('')}</div></div>
 </div>
 <button class="btn" onclick="doReg()">Зарегистрироваться</button>
 <button class="btn gray" onclick="doLogin()">Уже есть аккаунт — войти по телефону</button>
 </div></div>`;
}
function doReg(){
 const fam=v('rFam'),im=v('rIm'),ph=v('rPhone');
 if(!fam||!im||phoneNorm(ph).length!==10){toast('Заполните ФИО и телефон из 10 цифр');return;}
 if(db.users.some(u=>u.phone===phoneNorm(ph))){toast('Такой телефон уже зарегистрирован');return;}
 const spec=[...document.querySelectorAll('.specChk:checked')].map(c=>c.value);
 const u={id:uid(),fam,im,role:v('rRole'),status:v('rStatus'),phone:phoneNorm(ph),
  dims:v('rDims'),tons:v('rTons'),body:v('rBody'),temp:v('rTemp'),spec,
  verified:false,trust:9,inTransit:false,warnings:0,extra:[],deletedAt:null,restoreUntil:null};
 db.users.push(u);db.session=u.id;save();toast('Добро пожаловать!');go({screen:'feed',tab:'feed'});
}
function doLogin(){
 const ph=phoneNorm(v('rPhone'));const u=db.users.find(x=>x.phone===ph);
 if(!u){toast('Аккаунт не найден — зарегистрируйтесь');return;}
 if(u.deletedAt){if(Date.now()>u.restoreUntil){u.deletedAt=null;save();}else{db.session=u.id;save();toast('Профиль в восстановлении — 7 дней с удаления');go({screen:'feed'});return;}}
 db.session=u.id;save();toast('С возвращением, '+u.im+'!');go({screen:'feed',tab:'feed'});
}
function v(id){const e=document.getElementById(id);return e?e.value.trim():'';}

/* ============ ЛЕНТА ============ */
function banner(){
 if(db.settings.banner)return `<div class="banner"><img src="${db.settings.banner}"></div>`;
 return `<div class="banner">🚚 ПРОВЕРЕННЫЙ ГРУЗ — надёжные перевозки</div>`;
}
function trustCircles(pts){
 let h='';for(let i=0;i<5;i++){const f=pts>=3*(i+1)?'f3':pts>=3*i+2?'f2':pts>=3*i+1?'f1':'';h+=`<div class="circle ${f}"></div>`;}
 return `<div class="circles">${h}</div>`;
}
function scrFeed(){
 const u=me();const f=nav.loadFilter;
 let loads=db.loads.filter(l=>!l.archived);
 if(f.from)loads=loads.filter(l=>l.from===f.from);
 if(f.to)loads=loads.filter(l=>l.to===f.to);
 loads.sort((a,b)=>(a.date>b.date?-1:1));
 return `<div class="screen">
 ${banner()}
 <div class="card">
  <label>Откуда</label><select id="fFrom"><option value="">Весь Татарстан</option>${CITIES.map(c=>`<option ${f.from===c?'selected':''}>${c}</option>`).join('')}</select>
  <label>Куда</label><select id="fTo"><option value="">Россия (все города)</option>${CITIES.map(c=>`<option ${f.to===c?'selected':''}>${c}</option>`).join('')}</select>
  <div class="row"><button class="btn small" onclick="doSearch()">Найти</button>
  <button class="btn gray small" onclick="saveSearch()">🔔 Сохранить поиск</button>
  ${u.role==='owner'?`<button class="btn small" onclick="go({screen:'newload'})">+ Разместить груз</button>`:''}</div>
 </div>
 <h2>Новости</h2>
 ${db.news.length?db.news.map(n=>`<div class="card"><b>${esc(n.title)}</b><p class="small">${new Date(n.date).toLocaleDateString('ru')}</p>${n.cover?`<img src="${n.cover}" style="width:100%;border-radius:10px;margin:6px 0">`:''}<p>${esc(n.text)}</p></div>`).join(''):'<div class="card small">Пока пусто</div>'}
 <h2>Грузы (${loads.length})</h2>
 ${loads.length?loads.map(loadCard).join(''):'<div class="card small">Ничего не найдено. Сохраните поиск — уведомим, когда появится груз.</div>'}
 ${db.ads.length?`<h2>Реклама</h2>`+db.ads.map(a=>`<div class="card"><b>${esc(a.title)}</b><br><small>${esc(a.text)}</small><br><a href="${esc(a.url)}" target="_blank">Перейти →</a></div>`).join(''):''}
 </div>`;
}
function doSearch(){nav.loadFilter={from:v('fFrom'),to:v('fTo')};render();}
function saveSearch(){
 db.searches.push({id:uid(),userId:me().id,from:v('fFrom'),to:v('fTo'),on:true});
 save();toast('Поиск сохранён — уведомим о новых грузах');render();
}
function loadCard(l){
 const ow=db.users.find(x=>x.id===l.ownerId)||{im:'—',fam:'',verified:false,trust:0,phone:''};
 const fav=me().favs||[];const isF=fav.includes(l.id);
 return `<div class="card">
 <div class="row"><b style="flex:1">${esc(l.from)} → ${esc(l.to)}</b>
 <span style="cursor:pointer" onclick="toggleFav('${l.id}')">${isF?'⭐':'☆'}</span></div>
 <div>${l.km} км · <b>${l.rate} ₽/км</b> · ${PAY[l.pay]}</div>
 <div class="small">Погрузка: ${l.date}${l.desc?' · '+esc(l.desc):''}</div>
 ${l.photo?`<img src="${l.photo}" style="width:100%;border-radius:10px;margin-top:8px">`:''}
 <div class="row" style="margin-top:8px">
  <div style="flex:1">${ow.verified?'<span class="verified">✔ Проверенный</span>':''} ${trustCircles(ow.trust||0)}
  <div class="small">${esc(ow.fam)} ${esc(ow.im)}</div></div>
  <a class="btn small" href="tel:+7${ow.phone}">📞 Звонок</a>
  <a class="btn small" href="https://wa.me/7${ow.phone}" target="_blank">WhatsApp</a>
 </div></div>`;
}
function toggleFav(id){
 const u=me();u.favs=u.favs||[];
 u.favs.includes(id)?u.favs.splice(u.favs.indexOf(id),1):u.favs.push(id);
 save();render();
}

/* ============ РАЗМЕЩЕНИЕ ГРУЗА ============ */
function scrNewLoad(){
 return `<div class="screen"><div class="card"><h1>Новый груз</h1>
 <label>Откуда</label><select id="lFrom">${CITIES.map(c=>`<option>${c}</option>`).join('')}</select>
 <label>Куда</label><select id="lTo">${CITIES.map(c=>`<option>${c}</option>`).join('')}</select>
 <label>Расстояние (км)</label><input id="lKm" type="number">
 <label>Ставка (₽/км)</label><input id="lRate" type="number" step="0.1">
 <label>Дата погрузки</label><input id="lDate" type="date">
 <label>Оплата</label><select id="lPay">${PAY.map((p,i)=>`<option value="${i}">${p}</option>`).join('')}</select>
 <label>Комментарий</label><input id="lDesc">
 <label>Фото</label><input id="lPhoto" type="file" accept="image/*" onchange="pickImg(this,'photoTmp')">
 <img id="photoTmp" style="width:100%;border-radius:10px;display:none">
 <button class="btn" onclick="doLoad()">Опубликовать</button></div></div>`;
}
function pickImg(inp,tmpId){
 const f=inp.files[0];if(!f)return;const r=new FileReader();
 r.onload=()=>{window[tmpId]=r.result;const im=document.getElementById(tmpId);im.src=r.result;im.style.display='block';};
 r.readAsDataURL(f);
}
function doLoad(){
 const from=v('lFrom'),to=v('lTo'),km=+v('lKm'),rate=+v('lRate');
 if(!km||!rate){toast('Укажите км и ставку');return;}
 const l={id:uid(),ownerId:me().id,from,to,km,rate,date:v('lDate')||'сегодня',pay:+v('lPay'),desc:v('lDesc'),photo:window.photoTmp||null,created:Date.now()};
 db.loads.unshift(l);
 // уведомления по сохранённым поискам
 db.searches.filter(s=>s.on&&(!s.from||s.from===from)&&(!s.to||s.to===to)).forEach(s=>{
  if(s.userId!==me().id)db.notifs.push({id:uid(),userId:s.userId,text:`Новый груз: ${from} → ${to}, ${rate} ₽/км`,date:Date.now(),read:false});
 });
 save();toast('Груз опубликован!');go({screen:'feed',tab:'feed'});
}

/* ============ ИЗБРАННОЕ / УВЕДОМЛЕНИЯ / ЗАЯВКИ ============ */
function scrFavs(){
 const u=me();const list=db.loads.filter(l=>(u.favs||[]).includes(l.id));
 return `<div class="screen"><h1>Избранное</h1>${list.length?list.map(loadCard).join(''):'<div class="card small">Пока пусто. Добавляйте грузы звёздочкой ☆</div>'}</div>`;
}
function scrNotifs(){
 const list=db.notifs.filter(n=>n.userId===me().id).sort((a,b)=>b.date-a.date);
 return `<div class="screen"><h1>Уведомления</h1>
 ${list.length?list.map(n=>`<div class="card"><b>${esc(n.text)}</b><div class="small">${new Date(n.date).toLocaleString('ru')}</div></div>`).join(''):'<div class="card small">Пока нет уведомлений</div>'}</div>`;
}
function scrClaims(){
 const u=me();const mine=db.claims.filter(c=>c.userId===u.id);
 return `<div class="screen"><h1>Претензии</h1>
 <div class="card"><h2>Новая претензия</h2>
 <textarea id="clText" rows="3" placeholder="Опишите проблему"></textarea>
 <button class="btn" onclick="addClaim()">Отправить</button>
 <p class="small">Снять претензию может только администрация. После решения кружки доверия возвращаются.</p></div>
 ${mine.map(c=>`<div class="card"><b>${esc(c.text)}</b>
 <span class="pill ${c.status==='Решено'?'ok':'warn'}">${c.status}</span>
 <div class="small">${new Date(c.date).toLocaleString('ru')}</div></div>`).join('')}
 </div>`;
}
function addClaim(){
 const t=v('clText');if(!t){toast('Опишите проблему');return;}
 db.claims.push({id:uid(),userId:me().id,text:t,status:'Активная',date:Date.now()});
 db.viol.push({type:'claim',text:'Претензия от '+me().im,date:Date.now()});
 save();toast('Претензия отправлена админу');render();
}

/* ============ ПРОФИЛЬ ============ */
function scrProfile(){
 const u=me();
 const savedT=u.trust;
 return `<div class="screen">
 <div class="card" style="text-align:center">
  ${db.settings.logo?`<img class="logo" src="${db.settings.logo}">`:''}
  <h1>${esc(u.fam)} ${esc(u.im)}</h1>
  ${u.verified?'<span class="verified">✔ Проверенный</span> <span class="pill ok">Галочка</span>':'<span class="pill warn">Без галочки</span>'}
  <div style="margin:10px 0">${trustCircles(savedT)}<div class="small">Доверие: ${savedT}/15</div></div>
  <div class="pill">${u.role==='driver'?'Водитель':'Грузовладелец'}</div>
  <div class="pill">${esc(u.status)}</div>
  ${u.role==='driver'?`<div class="small">${esc(u.dims||'')} · ${esc(u.tons||'')} т · ${esc(u.body||'')} · ${esc(u.temp||'')}</div>
  ${u.spec&&u.spec.length?'<div>'+u.spec.map(s=>`<span class="pill">${esc(s)}</span>`).join('')+'</div>':''}
  <button class="btn ${u.inTransit?'red':''}" onclick="toggleTransit()">${u.inTransit?'🚚 В пути (нажмите, чтобы снять)':'Я в пути'}</button>`:''}
  <div class="small">+7 ${u.phone.slice(0,3)} ${u.phone.slice(3,6)}-${u.phone.slice(6,8)}-${u.phone.slice(8)}</div>
 </div>
 ${u.role==='driver'?`<div class="card"><h2>Доп. номера (до 5)</h2>
  <div id="extraList">${(u.extra||[]).map((p,i)=>`<div class="row"><span style="flex:1">+7 ${p}</span><button class="btn red small" onclick="delExtra(${i})">✕</button></div>`).join('')||'<span class="small">Нет номеров</span>'}</div>
  <input id="exPhone" placeholder="+7 900 000-00-00"><button class="btn" onclick="addExtra()">Добавить номер</button></div>`:''}
 <div class="card"><h2>Настройки</h2>
  <button class="btn gray" onclick="toggleTheme()">🌗 Тема: ${document.documentElement.dataset.theme==='dark'?'тёмная':'светлая'}</button>
  <button class="btn gray" onclick="go({screen:'charity'})">❤️ Благотворительность</button>
  <button class="btn gray" onclick="go({screen:'support'})">💬 Рекламная интеграция и поддержка</button>
  <button class="btn gray" onclick="go({screen:'apprev'})">⭐ Отзывы о приложении</button>
  ${u.role==='owner'||u.role==='driver'?`<button class="btn gray" onclick="go({screen:'reviews'})">📝 Отзывы обо мне и мои отзывы</button>`:''}
  <button class="btn red" onclick="delProfile()">Удалить профиль</button>
  <button class="btn gray" onclick="go({screen:'admin'})">🛠 Админ-панель</button>
 </div>
 <div class="card small">Подписывайся на наш канал в Telegram: <a href="${TATAR}" target="_blank">${TATAR}</a></div>
 </div>`;
}
function toggleTransit(){me().inTransit=!me().inTransit;save();render();}
function addExtra(){
 const u=me();u.extra=u.extra||[];const p=phoneNorm(v('exPhone'));
 if(p.length!==10){toast('Введите 10 цифр');return;}
 if(u.extra.length>=5){toast('Максимум 5 номеров');return;}
 u.extra.push(p);save();render();
}
function delExtra(i){me().extra.splice(i,1);save();render();}
function toggleTheme(){document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';render();}
function delProfile(){
 const u=me();u.deletedAt=Date.now();u.restoreUntil=Date.now()+7*86400000;
 save();db.session=null;toast('Профиль удалён. Восстановление возможно в течение 7 дней');render();
}
function scrRestore(){
 const u=db.users.find(x=>x.id===db.session);
 return `<div class="screen"><div class="card"><h1>Профиль удалён</h1>
 <p>Восстановление возможно до ${new Date(u.restoreUntil).toLocaleDateString('ru')}</p>
 <button class="btn" onclick="restoreProfile()">Восстановить профиль</button>
 <button class="btn gray" onclick="logout()">Выйти</button></div></div>`;
}
function restoreProfile(){const u=me();u.deletedAt=null;u.restoreUntil=null;save();go({screen:'feed'});}
function logout(){db.session=null;save();go({screen:'welcome'});}

/* ============ ОТЗЫВЫ / ЧС / ЦЕНЗУРА ============ */
function scrReviews(){
 const u=me();
 const about=db.reviews.filter(r=>r.targetId===u.id);
 const mine=db.reviews.filter(r=>r.authorId===u.id);
 return `<div class="screen"><h1>Отзывы</h1>
 <div class="card"><h2>Оставить отзыв о пользователе</h2>
 <label>Телефон пользователя</label><input id="rvPhone" placeholder="9000000000">
 <label>Оценка</label><select id="rvStars"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>
 <label>Текст</label><input id="rvText">
 <button class="btn" onclick="addReview()">Отправить отзыв</button>
 <p class="small">Удалить отзыв может только администрация.</p></div>
 <h2>Обо мне (${about.length})</h2>
 ${about.map(r=>`<div class="card"><b>${'★'.repeat(+r.stars)}${'☆'.repeat(5-r.stars)}</b> ${esc(r.text)}<div class="small">${new Date(r.date).toLocaleString('ru')}</div></div>`).join('')||'<div class="card small">Нет отзывов</div>'}
 <h2>Мои отзывы</h2>
 ${mine.map(r=>`<div class="card"><b>${'★'.repeat(+r.stars)}</b> ${esc(r.text)}</div>`).join('')||'<div class="card small">Вы ещё ничего не писали</div>'}
 </div>`;
}
function addReview(){
 const ph=phoneNorm(v('rvPhone'));const t=db.users.find(x=>x.phone===ph);
 if(!t){toast('Пользователь не найден');return;}
 const text=v('rvText');const bad=BAD.some(w=>text.toLowerCase().includes(w));
 if(bad){
  me().warnings++;db.viol.push({type:'censor',text:'Нарушение в отзыве: '+me().im,date:Date.now()});
  if(me().warnings>=3){db.blacklist.push({name:me().fam+' '+me().im,phone:me().phone,reason:'3 предупреждения',date:Date.now()});toast('Вы добавлены в Ч/С');}
  else toast('Предупреждение '+me().warnings+'/3: нарушены правила');
  save();render();return;
 }
 db.reviews.push({id:uid(),targetId:t.id,authorId:me().id,author:me().im,stars:+v('rvStars'),text,date:Date.now()});
 save();toast('Отзыв опубликован');render();
}

/* ============ ЧАРИТИ / ПОДДЕРЖКА ============ */
function scrCharity(){return `<div class="screen"><div class="card"><h1>❤️ Благотворительность</h1>
 <p>Мы помогаем детским домам Татарстана. С каждого оплаченного рейса 1 ₽ идёт на добрые дела.</p>
 <p class="small">Собрано: 0 ₽</p></div></div>`;}
function scrSupport(){return `<div class="screen"><div class="card"><h1>💬 Поддержка и реклама</h1>
 <p>По вопросам рекламы и поддержки пишите в Telegram:</p>
 <a class="btn" href="${TATAR}" target="_blank">Написать в Telegram</a>
 <p class="small">Подписывайся на наш канал!</p></div></div>`;}
function scrAppRev(){
 return `<div class="screen"><div class="card"><h1>Отзывы о приложении</h1>
 <label>Оценка</label><select id="arStars"><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option></select>
 <label>Текст</label><input id="arText">
 <button class="btn" onclick="addAppRev()">Оставить отзыв</button></div>
 ${db.appReviews.map(r=>`<div class="card"><b>${'★'.repeat(+r.stars)}</b> ${esc(r.text)}</div>`).join('')}</div>`;
}
function addAppRev(){const t=v('arText');if(!t){toast('Напишите текст');return;}
 db.appReviews.push({stars:v('arStars'),text:t,date:Date.now()});save();toast('Спасибо за отзыв!');render();}

/* ============ АДМИН-ПАНЕЛЬ ============ */
function scrAdmin(){
 if(!nav.admin){
  return `<div class="screen"><div class="card"><h1>🛠 Админ-панель</h1>
  <label>Код доступа</label><input id="admCode" type="password" placeholder="Введите код">
  <button class="btn" onclick="admLogin()">Войти</button>
  <button class="btn gray" onclick="go({screen:'feed',tab:'profile'})">Назад</button></div></div>`;
 }
 const u=me();
 return `<div class="screen"><h1>🛠 Админ-панель</h1>
 <div class="tabs"><button class="on" onclick="admTab('users')">Пользователи</button>
 <button onclick="admTab('claims')">Претензии</button><button onclick="admTab('news')">Новости</button>
 <button onclick="admTab('ads')">Реклама</button><button onclick="admTab('viol')">Журнал</button>
 <button onclick="admTab('look')">Оформление</button></div>
 <div id="admBody"></div>
 <button class="btn gray" onclick="go({screen:'feed',tab:'profile'})">Выйти из админки</button></div>`;
}
function admLogin(){
 if(djb2(v('admCode'))!==ADMIN_HASH){toast('Неверный код');return;}
 nav.admin=true;save();go({screen:'admin',tab:'profile'});admTab('users');
}
function admTab(t){
 document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));
 event.target.classList.add('on');
 const b=document.getElementById('admBody');
 if(t==='users'){
  b.innerHTML=`<div class="card"><h2>Пользователи</h2><table><tr><th>Имя</th><th>Телефон</th><th>✔</th><th>Доверие</th><th></th></tr>
  ${db.users.map(x=>`<tr><td>${esc(x.fam)} ${esc(x.im)}<br><span class="small">${x.role==='driver'?'Водитель':'Грузовл.'}</span></td>
  <td>+7${x.phone}</td>
  <td>${x.verified?'✔':'—'}</td><td>${x.trust}/15</td>
  <td><button class="btn small" onclick="admVerify('${x.id}')">✔/✕ галочка</button>
  <button class="btn red small" onclick="admWarn('${x.id}')">⚠ предупр.</button>
  <button class="btn red small" onclick="admBlack('${x.id}')">Ч/С</button></td></tr>`).join('')}
  </table></div>`;
 }
 if(t==='claims'){
  b.innerHTML=`<div class="card"><h2>Претензии</h2>
  ${db.claims.map(c=>{const au=db.users.find(x=>x.id===c.userId)||{im:'—'};return `<div class="card"><b>${esc(au.fam||'')} ${esc(au.im)}</b>: ${esc(c.text)} <span class="pill ${c.status==='Решено'?'ok':'warn'}">${c.status}</span>
  ${c.status!=='Решено'?`<button class="btn small" onclick="admSolve('${c.id}')">Решено (вернуть кружки)</button>`:''}</div>`;}).join('')||'<span class="small">Нет претензий</span>'}</div>`;
 }
 if(t==='news'){
  b.innerHTML=`<div class="card"><h2>Новость</h2>
  <input id="nTitle" placeholder="Заголовок"><textarea id="nText" rows="3" placeholder="Текст"></textarea>
  <input type="file" accept="image/*" onchange="pickImg(this,'newsCover')"><img id="newsCover" style="width:100%;border-radius:10px;display:none">
  <button class="btn" onclick="admNews()">Опубликовать</button></div>`;
 }
 if(t==='ads'){
  b.innerHTML=`<div class="card"><h2>Рекламная интеграция</h2>
  <input id="aTitle" placeholder="Название"><input id="aText" placeholder="Описание"><input id="aUrl" placeholder="Ссылка">
  <button class="btn" onclick="admAd()">Добавить</button></div>`;
 }
 if(t==='viol'){
  b.innerHTML=`<div class="card"><h2>Журнал нарушений</h2><table><tr><th>Тип</th><th>Событие</th><th>Дата</th></tr>
  ${db.viol.map(x=>`<tr><td>${x.type}</td><td>${esc(x.text)}</td><td>${new Date(x.date).toLocaleString('ru')}</td></tr>`).join('')}</table>
  <h2>Ч/С</h2>${db.blacklist.map(x=>`<div class="card"><b>${esc(x.name)}</b> +7${x.phone} — ${esc(x.reason)} <span class="pill red">Ч/С</span></div>`).join('')||'<span class="small">Пусто</span>'}</div>`;
 }
 if(t==='look'){
  b.innerHTML=`<div class="card"><h2>Оформление</h2>
  <label>Логотип</label><input type="file" accept="image/*" onchange="pickImg(this,'setLogo')"><img id="setLogo" style="height:44px;border-radius:10px;display:none" src="${db.settings.logo||''}">
  <label>Баннер ленты</label><input type="file" accept="image/*" onchange="pickImg(this,'setBanner')"><img id="setBanner" style="width:100%;border-radius:10px;display:none" src="${db.settings.banner||''}">
  <label>Telegram канала</label><input id="setTg" value="${esc(db.settings.tg)}">
  <button class="btn" onclick="admLook()">Сохранить оформление</button></div>`;
 }
}
function admVerify(id){const x=db.users.find(z=>z.id===id);x.verified=!x.verified;save();admTab('users');}
function admWarn(id){const x=db.users.find(z=>z.id===id);x.warnings++;db.viol.push({type:'warn',text:'Предупреждение: '+x.im,date:Date.now()});
 if(x.warnings>=3){db.blacklist.push({name:x.fam+' '+x.im,phone:x.phone,reason:'3 предупреждения',date:Date.now()});}
 save();admTab('users');}
function admBlack(id){const x=db.users.find(z=>z.id===id);x.trust=0;db.blacklist.push({name:x.fam+' '+x.im,phone:x.phone,reason:'Решение админа',date:Date.now()});
 db.viol.push({type:'blacklist',text:x.im+' в Ч/С',date:Date.now()});save();admTab('users');}
function admSolve(id){const c=db.claims.find(z=>z.id===id);c.status='Решено';
 const x=db.users.find(z=>z.id===c.userId);if(x){x.trust=Math.min(15,x.trust+3);}
 save();admTab('claims');}
function admNews(){db.news.unshift({id:uid(),title:v('nTitle'),text:v('nText'),cover:window.newsCover||null,date:Date.now()});save();toast('Новость опубликована');admTab('news');}
function admAd(){db.ads.push({id:uid(),title:v('aTitle'),text:v('aText'),url:v('aUrl')});save();toast('Реклама добавлена');admTab('ads');}
function admLook(){if(window.setLogo)db.settings.logo=window.setLogo;if(window.setBanner)db.settings.banner=window.setBanner;db.settings.tg=v('setTg')||db.settings.tg;save();toast('Оформление обновлено');render();}

/* ============ НИЖНЯЯ ПАНЕЛЬ ============ */
function navBar(){
 const t=nav.tab;
 return `<div class="nav">
 <button class="${t==='feed'?'on':''}" onclick="go({screen:'feed',tab:'feed'})"><span class="ic">🏠</span>Лента</button>
 <button class="${t==='favs'?'on':''}" onclick="go({screen:'favs',tab:'favs'})"><span class="ic">⭐</span>Избранное</button>
 <button class="${t==='claims'?'on':''}" onclick="go({screen:'claims',tab:'claims'})"><span class="ic">⚖️</span>Претензии</button>
 <button class="${t==='notifs'?'on':''}" onclick="go({screen:'notifs',tab:'notifs'})"><span class="ic">🔔</span>Уведомл.</button>
 <button class="${t==='profile'?'on':''}" onclick="go({screen:'profile',tab:'profile'})"><span class="ic">👤</span>Профиль</button>
 </div>`;
}

/* ============ РЕНДЕР ============ */
function render(){
 document.documentElement.dataset.theme=document.documentElement.dataset.theme||'dark';
 const s=route();let h='';
 if(s==='welcome')h=scrWelcome();
 else if(s==='blocked')h=scrBlocked();
 else if(s==='auth')h=scrAuth();
 else if(s==='restore')h=scrRestore();
 else if(s==='admin')h=scrAdmin();
 else if(s==='feed')h=scrFeed();
 else if(s==='newload')h=scrNewLoad();
 else if(s==='favs')h=scrFavs();
 else if(s==='claims')h=scrClaims();
 else if(s==='notifs')h=scrNotifs();
 else if(s==='profile')h=scrProfile();
 else if(s==='reviews')h=scrReviews();
 else if(s==='apprev')h=scrAppRev();
 else if(s==='charity')h=scrCharity();
 else if(s==='support')h=scrSupport();
 document.getElementById('app').innerHTML=h+(db.session?navBar():'');
}
render();
</script>
</body></html>
