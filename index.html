<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ПРОВЕРЕННЫЙ ГРУЗ</title>
<style>
:root{--bg1:#0b0f1a;--bg2:#141b2e;--acc:#f5b942;--acc2:#ff8a3c;--tx:#f2f4fa;--mut:#93a0b8;--glass:rgba(255,255,255,.06);--brd:rgba(255,255,255,.14);--ok:#39d98a;--bad:#ff5c6c}
body.light{--bg1:#eef2f9;--bg2:#dbe4f2;--tx:#182035;--mut:#5b6a85;--glass:rgba(255,255,255,.55);--brd:rgba(20,30,60,.12)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,'SF Pro Display','Segoe UI',Roboto,sans-serif;background:radial-gradient(1200px 700px at 20% -10%,rgba(245,185,66,.14),transparent 60%),radial-gradient(1000px 700px at 90% 110%,rgba(64,120,255,.14),transparent 60%),linear-gradient(160deg,var(--bg1),var(--bg2));color:var(--tx);min-height:100vh;padding-bottom:90px;transition:background .3s}
.glass{background:var(--glass);border:1px solid var(--brd);border-radius:22px;backdrop-filter:blur(22px) saturate(150%);-webkit-backdrop-filter:blur(22px) saturate(150%);box-shadow:0 12px 40px rgba(0,0,0,.25)}
.wrap{max-width:560px;margin:0 auto;padding:16px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;padding:15px;border:none;border-radius:16px;font-size:16px;font-weight:700;cursor:pointer;color:#1b1200;background:linear-gradient(135deg,var(--acc),var(--acc2));box-shadow:0 10px 26px rgba(245,150,60,.35);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--tx);border:1px solid var(--brd);box-shadow:none}
.btn.small{width:auto;padding:9px 14px;font-size:14px;border-radius:12px}
.btn.ok{background:linear-gradient(135deg,#39d98a,#22b573);color:#04140c}
.btn.bad{background:linear-gradient(135deg,#ff5c6c,#d63a4a);color:#fff}
input,select,textarea{width:100%;padding:13px 14px;border-radius:14px;border:1px solid var(--brd);background:var(--glass);color:var(--tx);font-size:15px;outline:none;backdrop-filter:blur(10px)}
input:focus,textarea:focus,select:focus{border-color:var(--acc)}
label{font-size:13px;color:var(--mut);display:block;margin:12px 0 6px}
h1{font-size:30px;font-weight:800;letter-spacing:.5px}
h2{font-size:20px;margin:18px 0 10px}
h3{font-size:16px}
.mut{color:var(--mut);font-size:13px}
.top{display:flex;align-items:center;gap:10px;padding:14px 4px 6px}
.logo{width:46px;height:46px;border-radius:14px;overflow:hidden;flex-shrink:0;box-shadow:0 6px 18px rgba(245,150,60,.4)}
.logo img,.logo svg{width:100%;height:100%;object-fit:cover;display:block}
.spacer{flex:1}
.iconbtn{width:40px;height:40px;border-radius:12px;border:1px solid var(--brd);background:var(--glass);color:var(--tx);font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.banner{height:120px;border-radius:22px;overflow:hidden;margin:14px 0;position:relative}
.banner img,.banner svg{width:100%;height:100%;object-fit:cover;display:block}
.banner .tag{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);color:#ffd479;font-size:10px;font-weight:800;padding:4px 9px;border-radius:20px;letter-spacing:.5px}
.search{display:flex;gap:8px;margin:10px 0}
.card{padding:14px;margin:12px 0;cursor:pointer}
.route{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;margin-bottom:4px}
.dotline{flex:1;border-top:2px dotted var(--mut);opacity:.5}
.truckph{width:110px;height:74px;flex-shrink:0}
.cardrow{display:flex;gap:12px;align-items:center}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--glass);border:1px solid var(--brd);border-radius:20px;padding:4px 10px;font-size:12px;color:var(--mut);margin:3px 4px 0 0}
.pill.gold{color:#ffd479;border-color:rgba(245,185,66,.5)}
.price{font-size:20px;font-weight:900;color:#ffd479}
.acts{display:flex;gap:8px;margin-top:10px}
.acts .btn{padding:10px;font-size:14px;border-radius:12px}
.fav{position:absolute;top:10px;right:10px;font-size:22px;background:none;border:none;cursor:pointer;filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
.card{position:relative}
.check{color:var(--ok);font-weight:800}
.circles{display:flex;gap:6px;margin:6px 0}
.circ{width:22px;height:22px;border-radius:50%;border:2px solid var(--brd);overflow:hidden;position:relative;background:var(--glass)}
.circ i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,var(--ok),#7ef0b6)}
.nav{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;padding:10px 6px calc(12px + env(safe-area-inset-bottom));background:rgba(15,20,35,.75);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid var(--brd);z-index:50}
body.light .nav{background:rgba(255,255,255,.7)}
.nav button{background:none;border:none;color:var(--mut);font-size:11px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;flex:1;padding:4px 0}
.nav button.act{color:var(--acc);font-weight:700}
.nav .ic{font-size:20px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center;z-index:100}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:20px;border-radius:26px 26px 0 0}
.toast{position:fixed;top:16px;left:50%;transform:translateX(-50%);background:linear-gradient(135deg,rgba(20,26,45,.95),rgba(35,45,75,.95));color:#fff;padding:12px 20px;border-radius:16px;border:1px solid var(--brd);z-index:200;font-size:14px;box-shadow:0 12px 30px rgba(0,0,0,.4);animation:tin .3s}
@keyframes tin{from{opacity:0;transform:translate(-50%,-12px)}}
.row{display:flex;align-items:center;gap:10px}
.list{margin:8px 0}
.item{padding:12px;border-radius:16px;border:1px solid var(--brd);background:var(--glass);margin:8px 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.news{padding:0;overflow:hidden}
.news img,.news svg{width:100%;height:150px;object-fit:cover;display:block}
.news .nb{padding:12px}
.timer{font-variant-numeric:tabular-nums;font-weight:800;color:#ffd479}
.badge{display:inline-block;padding:3px 10px;border-radius:14px;font-size:11px;font-weight:800}
.b-ok{background:rgba(57,217,138,.15);color:var(--ok)}
.b-warn{background:rgba(255,180,60,.15);color:#ffb43c}
.b-bad{background:rgba(255,92,108,.15);color:var(--bad)}
.checkrow{display:flex;gap:10px;align-items:flex-start;padding:14px;border-radius:16px;border:1px solid var(--brd);background:var(--glass);margin:10px 0}
.checkrow input{width:22px;height:22px;flex-shrink:0;margin-top:2px;accent-color:var(--acc)}
.avatar{width:64px;height:64px;border-radius:50%;background:linear-gradient(135deg,var(--acc),var(--acc2));display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:900;color:#1b1200;flex-shrink:0}
hr{border:none;border-top:1px solid var(--brd);margin:14px 0}
.cent{text-align:center}
</style>
</head>
<body>
<div id="app" class="wrap"></div>
<div class="nav" id="nav" style="display:none"></div>
<script>
const A_HASH="be9fa070";
const CITIES=["Казань", "Набережные Челны", "Нижнекамск", "Альметьевск", "Зеленодольск", "Бугульма", "Елабуга", "Лениногорск", "Чистополь", "Нурлат", "Нижняя Мактама", "Агрыз", "Арск", "Буинск", "Азнакаево", "Менделеевск", "Мензелинск", "Мамадыш", "Кукмор", "Лаишево", "Пестрецы", "Тетюши", "Заинск", "Бавлы", "Актаныш", "Алексеевское", "Апастово", "Балтаси", "Верхний Услон", "Высокая Гора", "Дрожжаное", "Кайбицы", "Камское Устье", "Муслюмово", "Новошешминск", "Рыбная Слобода", "Саба", "Сарманово", "Спасск", "Тюлячи", "Черемшан", "Шемордан", "Иннополис", "Болгар", "Свияжск", "Москва", "Санкт-Петербург", "Уфа", "Самара", "Тольятти", "Сызрань", "Чебоксары", "Йошкар-Ола", "Ижевск", "Саранск", "Пермь", "Киров", "Нижний Новгород", "Дзержинск", "Ульяновск", "Димитровград", "Пенза", "Кузнецк", "Саратов", "Энгельс", "Балаково", "Волгоград", "Волжский", "Ростов-на-Дону", "Таганрог", "Краснодар", "Новороссийск", "Сочи", "Ставрополь", "Пятигорск", "Минеральные Воды", "Грозный", "Махачкала", "Дербент", "Астрахань", "Екатеринбург", "Челябинск", "Магнитогорск", "Тюмень", "Курган", "Оренбург", "Орск", "Уральск", "Октябрьский", "Туймазы", "Стерлитамак", "Салават", "Нефтекамск", "Кама", "Нижневартовск", "Сургут", "Ханты-Мансийск", "Тобольск", "Чайковский", "Воткинск", "Глазов", "Курск", "Белгород", "Воронеж", "Липецк", "Тула", "Рязань", "Владимир", "Иваново", "Ярославль", "Кострома", "Тверь", "Смоленск", "Брянск", "Орёл", "Калуга", "Сергиев Посад", "Подольск", "Балашиха", "Люберцы", "Красногорск", "Мытищи", "Пушкино", "Клин", "Коломна", "Великий Новгород", "Псков", "Вологда", "Череповец", "Архангельск", "Северодвинск", "Мурманск", "Петрозаводск", "Сыктывкар", "Ухта", "Нарьян-Мар", "Иркутск", "Красноярск", "Новосибирск", "Омск", "Томск", "Кемерово", "Новокузнецк", "Барнаул", "Горно-Алтайск", "Абакан", "Кызыл", "Чита", "Улан-Удэ", "Якутск", "Магадан", "Петропавловск-Камчатский", "Южно-Сахалинск", "Хабаровск", "Владивосток", "Уссурийск", "Находка", "Артём", "Благовещенск", "Биробиджан", "Анадырь", "Норильск", "Ноябрьск", "Новый Уренгой", "Губкинский", "Салехард", "Копейск", "Миасс", "Златоуст", "Первоуральск", "Серов", "Нижний Тагил", "Алапаевск", "Ирбит", "Шадринск", "Ессентуки", "Кисловодск", "Карачаевск", "Нальчик", "Владикавказ", "Назрань", "Магас", "Элиста", "Слободской", "Норлат"];
const SPEC=["Манипулятор","Экскаватор-погрузчик","Экскаватор гусеничный","Экскаватор колёсный","Бульдозер","Грейдер","Автокран","Кран-манипулятор","Самосвал","Автовышка","Гидромолотовоз","Бетономешалка","Автобетононасос","Тонар-самосвал","Трал (низкорамник)","Погрузчик вилочный","Погрузчик телескопический","Каток дорожный","Ямобур","Ассенизатор","Иловоз","Бензовоз"];
const KY=["Тент","Рефрижератор","Борт","Изотерм","Зерновоз","Цистерна","Самосвал","Контейнеровоз","Пирамида (автовоз)","Открытый (без тента)"];
const BADW=["дурак","идиот","скам","мошенник","тупой","лох"];
function def(){return{screen:"rules",users:[],session:null,trial:null,theme:"dark",
listings:[],claims:[],reviews:[],blacklist:[],warnings:[],saved:[],news:[],ads:[],
uploads:{logo:"",banner:""},logs:[],appReviews:[],notifSeen:Date.now(),myExtra:[],onRoad:false}}
let S;try{S=JSON.parse(localStorage.getItem("pg_app_v3"))||def()}catch(e){S=def()}
if(!S.listings||!S.listings.length)S.listings=seed();
function save(){localStorage.setItem("pg_app_v3",JSON.stringify(S))}
function seed(){
 const D=[["Казань","Москва",185,"наличные"],["Казань","Набережные Челны",78,"без НДС"],["Нижнекамск","Уфа",112,"с НДС"],["Альметьевск","Самара",124,"наличные"],["Елабуга","Екатеринбург",212,"без НДС"],["Набережные Челны","Санкт-Петербург",348,"с НДС"],["Зеленодольск","Нижний Новгород",124,"наличные"],["Бугульма","Оренбург",148,"без НДС"],["Чистополь","Ижевск",96,"наличные"],["Казань","Тольятти",142,"с НДС"],["Нурлат","Ульяновск",86,"наличные"],["Лениногорск","Чебоксары",108,"без НДС"],["Агрыз","Пермь",134,"с НДС"],["Мамадыш","Киров",118,"наличные"],["Азнакаево","Саратов",186,"без НДС"],["Иннополис","Казань",21,"наличные"]];
 return D.map((d,i)=>({id:i+1,from:d[0],to:d[1],rate:d[2],pay:d[3],
 date:["24 окт","25 окт","26 окт","27 окт","28 окт"][i%5],
 name:["Рустам Г.","Ильнар Ф.","Дмитрий К.","Айдар Ш.","Сергей В.","Ринат М.","Марат З.","Олег Т.","Артур Н.","Владимир П.","Эдуард С.","Антон Р.","Николай Б.","Рашид Х.","Павел Л.","Ильдар Я."][i],
 phone:"+7900000000"+i,
 tonnage:[1.5,3,5,10,20][i%5],vol:[6,12,20,33,40,55,86,92][i%8],
 body:KY[i%KY.length],temp:i%3==0?"от -20 °C до +8 °C":"без режима",
 spec:i%4==3?SPEC[i%SPEC.length]:"",verified:i%2==0,trust:(i%15),
 photo:i%6}));
}
function km(a,b){let s=a+b,h=7;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%893;return h+180}
function me(){return S.users.find(u=>u.id===S.session)}
function esc(s){return String(s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;")}
function toast(t){const d=document.createElement("div");d.className="toast";d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),3200)}
function phone(v){let d=v.replace(/\D/g,"");if(d[0]=="8")d="7"+d.slice(1);if(d[0]!="7")d="7"+d;return"+"+d.slice(0,11)}
function truckSVG(i){
 const pal=[["#f5b942","#ff8a3c"],["#4f8bff","#7b5cff"],["#39d98a","#1fb98a"],["#ff5c6c","#ff8a9c"],["#8ea2c9","#5b6a85"],["#ffd479","#f5b942"]];
 const c=pal[i%6];
 return '<svg class="truckph" viewBox="0 0 120 80"><defs><linearGradient id="g'+i+'" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="'+c[0]+'"/><stop offset="1" stop-color="'+c[1]+'"/></linearGradient></defs><rect x="2" y="14" rx="6" width="70" height="42" fill="url(#g'+i+')"/><rect x="72" y="26" rx="5" width="34" height="30" fill="'+c[1]+'"/><rect x="76" y="30" width="22" height="12" rx="2" fill="rgba(255,255,255,.35)"/><circle cx="24" cy="60" r="9" fill="#1a1f2e"/><circle cx="24" cy="60" r="4" fill="#57637d"/><circle cx="46" cy="60" r="9" fill="#1a1f2e"/><circle cx="46" cy="60" r="4" fill="#57637d"/><circle cx="94" cy="60" r="9" fill="#1a1f2e"/><circle cx="94" cy="60" r="4" fill="#57637d"/><rect x="2" y="56" width="104" height="3" rx="1.5" fill="rgba(0,0,0,.3)"/></svg>';
}
function logoHTML(){
 if(S.uploads.logo)return '<div class="logo"><img src="'+S.uploads.logo+'"></div>';
 return '<div class="logo"><svg viewBox="0 0 48 48"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5b942"/><stop offset="1" stop-color="#ff8a3c"/></linearGradient></defs><rect width="48" height="48" rx="12" fill="url(#lg)"/><path d="M10 30 L18 14 L24 24 L30 14 L38 30" stroke="#1b1200" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><rect x="10" y="33" width="28" height="4" rx="2" fill="#1b1200"/></svg></div>';
}
function trustHTML(n){let h='<div class="circles">';for(let i=0;i<5;i++){let f=Math.max(0,Math.min(3,n-i*3));h+='<span class="circ">'+(f?'<i style="width:'+(f/3*100)+'%"></i>':"")+'</span>'}return h+"</div>"}
function bannerHTML(){
 let ad=S.ads.length?'<div class="tag">РЕКЛАМНАЯ ИНТЕГРАЦИЯ · '+esc(S.ads[S.ads.length-1].title)+'</div>':"";
 if(S.uploads.banner)return '<div class="banner"><img src="'+S.uploads.banner+'">'+ad+'</div>';
 return '<div class="banner"><svg viewBox="0 0 400 120" preserveAspectRatio="xMidYMid slice"><defs><linearGradient id="bg1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f5b942"/><stop offset="1" stop-color="#ff8a3c"/></linearGradient></defs><rect width="400" height="120" fill="url(#bg1)"/><path d="M300 84 L318 52 L324 64 L336 52 L352 84 Z" fill="rgba(20,15,0,.55)"/><circle cx="312" cy="90" r="6" fill="rgba(20,15,0,.55)"/><circle cx="340" cy="90" r="6" fill="rgba(20,15,0,.55)"/><text x="26" y="52" font-size="22" font-weight="800" fill="#1b1200">ПРОВЕРЕННЫЙ ГРУЗ</text><text x="26" y="76" font-size="13" fill="rgba(20,15,0,.7)">Грузоперевозки по Татарстану и России</text></svg>'+ad+'</div>';
}
function go(s){S.screen=s;save();render()}
function censored(text,uid){
 const low=(text||"").toLowerCase();
 for(const w of BADW)if(low.includes(w)){
  if(uid){let u=S.users.find(x=>x.id===uid);if(u){u.warn=(u.warn||0)+1;
   S.logs.unshift({t:Date.now(),txt:"Предупреждение «"+w+"» → "+u.name+(u.warn>=3?" → Ч/С":"")});
   if(u.warn>=3&&!S.blacklist.includes(u.phone))S.blacklist.push(u.phone);}}
  return true}
 return false}
function checkTrial(){
 if(S.session)return false;
 if(!S.trial){S.screen="rules";return true}
 if(Date.now()-S.trial>86400000){S.screen="blocked";return true}
 return false}
function render(){
 document.body.className=S.theme;
 const app=document.getElementById("app"),nav=document.getElementById("nav");
 if(checkTrial())return;
 nav.style.display=["feed","saved","fav","claims","profile"].includes(S.screen)?"flex":"none";
 let h="";
 if(S.screen=="rules")h=scrRules();
 else if(S.screen=="blocked")h=scrBlocked();
 else if(S.screen=="reg")h=scrReg();
 else if(S.screen=="feed")h=scrFeed();
 else if(S.screen=="saved")h=scrSaved();
 else if(S.screen=="fav")h=scrFav();
 else if(S.screen=="claims")h=scrClaims();
 else if(S.screen=="profile")h=scrProfile();
 else if(S.screen=="admin")h=scrAdmin();
 app.innerHTML=h;
 if(["feed","saved","fav","claims","profile"].includes(S.screen))nav.innerHTML=navHTML();
}
function navHTML(){
 const t=[["feed","🚚","Лента"],["saved","🔔","Поиски"],["fav","⭐","Избранное"],["claims","📄","Претензии"],["profile","👤","Профиль"]];
 return t.map(x=>'<button class="'+(S.screen==x[0]?"act":"")+'" onclick="go(\''+x[0]+'\')"><span class="ic">'+x[1]+'</span>'+x[2]+'</button>').join("");
}
function scrRules(){return `
 <div style="height:26vh"></div>
 <div class="glass" style="padding:26px">${logoHTML().replace('class="logo"','class="logo" style="margin:0 auto 16px;width:72px;height:72px;border-radius:20px"')}
 <div class="cent"><h1>ПРОВЕРЕННЫЙ ГРУЗ</h1><p class="mut" style="margin-top:6px">Перевозки Татарстан и вся Россия</p></div>
 <hr>
 <div class="checkrow"><input type="checkbox" id="ck1"><div><b>Правила приложения</b><p class="mut" style="margin-top:4px">Настоящие грузы, честные ставки ₽/км и точные километры. Претензии решает администрация. За 3 предупреждения — Чёрный список. Оплата: наличные, с НДС или без НДС.</p></div></div>

 if(!ADM.authed)return `<div style="height:18vh"></div><div class="glass" style="padding:24px;text-align:center"><div style="font-size:44px">🛡</div><h2 style="margin:10px 0 4px">Админ-панель</h2><p class="mut">Введите код доступа</p><input id="adm_code" type="password" placeholder="••••••••" style="margin-top:12px;text-align:center;letter-spacing:4px"><button class="btn" style="margin-top:14px" onclick="admLogin()">Войти</button><button class="btn ghost" style="margin-top:10px" onclick="go('feed')">Назад</button></div>`;
 const tabs=[["users","Пользователи"],["claims","Претензии"],["news","Новости"],["ads","Реклама"],["files","Логотип и баннеры"],["log","Журнал нарушений"]];
 let h=`<div class="top"><div style="flex:1"><h2 style="margin:0">🛡 Админ-панель</h2></div><button class="iconbtn" onclick="toggleTheme()">🌓</button></div><div class="search" style="flex-wrap:wrap">${tabs.map(t=>'<button class="btn small '+(ADM.tab==t[0]?"":"ghost")+'" onclick="ADM.tab=\''+t[0]+'\';render()">'+t[1]+"</button>").join("")}</div><div class="glass" style="padding:18px">`;
 if(ADM.tab=="users"){h+="<h3>Пользователи</h3>"+S.users.map(u=>'<div class="item"><div class="row"><div style="flex:1">'+userCard(u)+'<div class="mut">Телефон: '+esc(u.tel)+' · Предупреждений: '+(u.warn||0)+'/3 '+(S.blacklist.includes(u.phone)?'<span class="badge b-bad">Ч/С</span>':'<span class="badge b-ok">Активен</span>')+'</div></div></div><div class="acts"><button class="btn small '+(u.verified?"ghost":"ok")+'" onclick="admVerify('+u.id+')">'+(u.verified?"Снять галочку":"✓ Выдать галочку")+'</button><button class="btn small ghost" onclick="admWarn('+u.id+')">⚠ Предупреждение</button><button class="btn small '+(S.blacklist.includes(u.phone)?"ok":"bad")+'" onclick="admBlack('+u.id+')">'+(S.blacklist.includes(u.phone)?"Убрать из Ч/С":"В Ч/С")+'</button></div></div>').join("")||'<p class="mut">Пользователей пока нет</p>'}
 if(ADM.tab=="claims"){h+="<h3>Претензии</h3>"+S.claims.map((c,i)=>'<div class="item"><div class="row"><b style="flex:1">'+esc(c.to)+'</b><span class="badge '+(c.status=="Активная"?"b-warn":"b-ok")+'">'+c.status+'</span></div><p class="mut">'+esc(c.txt)+'</p>'+(c.status=="Активная"?'<button class="btn small ok" style="margin-top:8px" onclick="admClose('+i+')">✓ Решено</button>':'<p class="mut" style="margin-top:6px">Решено — кружки доверия возвращены</p>')+"</div>").join("")||'<p class="mut">Претензий нет</p>'}
 if(ADM.tab=="news"){h+='<h3>Новость</h3><input id="n_t" placeholder="Заголовок"><label>Обложка</label><input type="file" accept="image/*" id="n_c" onchange="NEWS.img=event.target.files[0]"><textarea id="n_x" rows="3" placeholder="Текст новости"></textarea><button class="btn" style="margin-top:12px" onclick="admNews()">Опубликовать</button>'+(S.news.length?'<hr>'+S.news.map((n,i)=>'<div class="item"><b>'+esc(n.title)+'</b><p class="mut">'+esc(n.text)+'</p><button class="btn small bad" onclick="S.news.splice('+i+',1);save();render()">Удалить</button></div>').join(""):"")}
 if(ADM.tab=="ads"){h+='<h3>Рекламная интеграция</h3><input id="a_t" placeholder="Название интеграции"><textarea id="a_x" rows="2" placeholder="Краткое описание"></textarea><button class="btn" style="margin-top:12px" onclick="admAd()">Добавить</button>'+(S.ads.length?'<hr>'+S.ads.map((a,i)=>'<div class="item"><span class="badge b-warn">РЕКЛАМНАЯ ИНТЕГРАЦИЯ</span> <b>'+esc(a.title)+'</b><p class="mut">'+esc(a.txt)+'</p><button class="btn small bad" onclick="S.ads.splice('+i+',1);save();render()">Удалить</button></div>').join(""):"")}
 if(ADM.tab=="files"){h+='<h3>Логотип и баннеры</h3><p class="mut">Загрузите реальные фото — они появятся в шапке и в ленте.</p><label>Логотип</label><input type="file" accept="image/*" id="up_logo" onchange="upl(this,\'logo\')"><label>Баннер ленты</label><input type="file" accept="image/*" id="up_ban" onchange="upl(this,\'banner\')">'+(S.uploads.logo||S.uploads.banner?'<hr><div class="row"><div>'+(S.uploads.logo?'<img src="'+S.uploads.logo+'" style="width:56px;height:56px;border-radius:14px;object-fit:cover">':'')+'</div>'+(S.uploads.banner?'<img src="'+S.uploads.banner+'" style="height:70px;border-radius:14px;object-fit:cover;flex:1">':'')+'<button class="btn small bad" onclick="S.uploads={logo:\'\',banner:\'\'};save();render()">Сбросить</button></div>':'')}
 if(ADM.tab=="log"){h+='<h3>Журнал нарушений</h3>'+(S.logs.length?S.logs.map(l=>'<div class="item mut">'+new Date(l.t).toLocaleString("ru")+' — '+esc(l.txt)+"</div>").join(""):'<p class="mut">Нарушений нет</p>')}
 return h+"</div><button class='btn ghost' style='margin:14px 0' onclick=\"go('feed')\">← В приложение</button>"}
function admLogin(){const c=document.getElementById("adm_code").value.trim();if(jh(c)==A_HASH){ADM.authed=true;render()}else toast("Неверный код")}
function jh(s){let x=5381;for(let i=0;i<s.length;i++){x=((x*33)+s.charCodeAt(i))>>>0}return x.toString(16)}
function admVerify(id){const u=S.users.find(x=>x.id==id);u.verified=!u.verified;save();render()}
function admWarn(id){const u=S.users.find(x=>x.id==id);u.warn=(u.warn||0)+1;S.logs.unshift({t:Date.now(),txt:"Админ выдал предупреждение → "+u.name+(u.warn>=3?" → Ч/С":"")});if(u.warn>=3&&!S.blacklist.includes(u.phone))S.blacklist.push(u.phone);save();render()}
function admBlack(id){const u=S.users.find(x=>x.id==id);const i=S.blacklist.indexOf(u.phone);i>=0?S.blacklist.splice(i,1):S.blacklist.push(u.phone);S.logs.unshift({t:Date.now(),txt:"Админ изменил Ч/С → "+u.name});save();render()}
function admClose(i){S.claims[i].status="Решено";const u=S.users.find(x=>x.id==S.claims[i].uid);if(u){u.trust=Math.min(15,(u.trust||0)+1)}S.logs.unshift({t:Date.now(),txt:"Претензия закрыта: "+S.claims[i].to});save();render()}
var NEWS={};function admNews(){const t=document.getElementById("n_t").value.trim(),x=document.getElementById("n_x").value.trim();if(!t)return;const f=document.getElementById("n_c").files[0];const push=src=>{S.news.unshift({title:t,text:x,cover:src||""});save();NEWS={};render();toast("Новость опубликована")};if(f){const r=new FileReader();r.onload=e=>push(e.target.result);r.readAsDataURL(f)}else push()}
function admAd(){const t=document.getElementById("a_t").value.trim();if(!t)return;censored(document.getElementById("a_x").value);S.ads.push({title:t,txt:document.getElementById("a_x").value||""});save();render();toast("Реклама добавлена")}
function upl(inp,key){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=e=>{S.uploads[key]=e.target.result;save();render();toast("Загружено ✓")};r.readAsDataURL(f)}

function notifySaved(){
 const fresh=S.listings.filter(t=>t.id>S.notifSeen);
 const hit=S.saved.filter(s=>fresh.some(t=>t.from==s.city||t.to==s.city));
 if(hit.length)setTimeout(()=>toast("🔔 Новые грузы: "+hit.map(h=>h.city).join(", ")),1200);
 S.notifSeen=Math.max.apply(null,S.listings.map(t=>t.id));save()}
function modal(h){const d=document.createElement("div");d.className="modal";d.id="md";d.onclick=e=>{if(e.target.id=="md")closeModal()};d.innerHTML='<div class="sheet glass">'+h+"</div>";document.body.appendChild(d)}
function closeModal(){document.getElementById("md")&&document.getElementById("md").remove()}
window.go=go;window.toggleFav=toggleFav;window.openTruck=openTruck;window.saveSearch=saveSearch;window.toggleTheme=toggleTheme;window.startTrial=startTrial;window.doReg=doReg;window.makeClaim=makeClaim;window.claimTo=claimTo;window.addExtra=addExtra;window.appReview=appReview;window.delProfile=delProfile;window.confirmDel=confirmDel;window.admLogin=admLogin;window.admVerify=admVerify;window.admWarn=admWarn;window.admBlack=admBlack;window.admClose=admClose;window.admNews=admNews;window.admAd=admAd;window.upl=upl;window.REG=REG;window.FEED=FEED;window.CLAIM=CLAIM;window.ADM=ADM;window.me=me;window.closeModal=closeModal;window.NEWS=NEWS;window.truckSVG=truckSVG;window.userCard=userCard;
function boot(){
 if(S.session){const u=S.users.find(x=>x.id==S.session);if(!u){S.session=null;save()}}
 if(S.session)S.screen="feed";
 restoreCheck();render();notifySaved()}
boot();
</script>
